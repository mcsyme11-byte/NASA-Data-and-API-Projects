# NASA and ESA Data Projects · Mars Data: process chunks of Curiosity REMS data · © 2026 Malcolm Syme · mcsyme11@gmail.com
#
# Runs on the mars-probe branch while the cleaning is being checked chunk by chunk: processes the chunks listed in
# mars-data/analysis/chunks.txt with run_rems.py (SOL_… folders) and run_uv.py (REMS_UVS_… corrected UV files) and commits the summaries and cleaning reports to the branch.
# Replaced by the scheduled "Mars data" job on main once every chunk has been checked.

name: Mars data chunks (checking)

on:
  push:
    branches: [mars-probe]
    paths: [mars-data/analysis/chunks.txt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mars-chunks
  cancel-in-progress: false

jobs:
  chunks:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pandas
        run: pip install pandas==2.2.3
      - name: Process the listed chunks, saving after each one
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898309+github-actions[bot]@users.noreply.github.com"
          for c in $(grep -E '^(SOL_|REMS_UVS_)' mars-data/analysis/chunks.txt); do
            if [[ "$c" == SOL_* ]]; then (cd mars-data/analysis && python3 run_rems.py "$c"); else (cd mars-data/analysis && python3 run_uv.py "$c"); fi
            git add mars-data/data/rems
            git commit -q -m "Mars data: $c processed" || echo "Nothing new for $c"
            git pull -q --rebase origin mars-probe
            git push -q origin HEAD:mars-probe
          done

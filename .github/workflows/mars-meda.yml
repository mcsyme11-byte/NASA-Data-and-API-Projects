# NASA and ESA Data Projects · Mars Data: process chunks of Perseverance MEDA data · © 2026 Malcolm Syme · mcsyme11@gmail.com
#
# Runs on the mars-probe branch while the MEDA cleaning is checked chunk by chunk: processes the chunks listed in
# mars-data/analysis/meda_chunks.txt with run_meda.py, saving and pushing after each chunk.

name: Mars data MEDA chunks (checking)

on:
  push:
    branches: [mars-probe]
    paths: [mars-data/analysis/meda_chunks.txt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mars-meda
  cancel-in-progress: false

jobs:
  chunks:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pandas
        run: pip install pandas==2.2.3
      - name: Process the listed chunks, saving after each one
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for c in $(grep -E '^sol_' mars-data/analysis/meda_chunks.txt); do
            (cd mars-data/analysis && python3 run_meda.py "$c")
            git add mars-data/data/meda
            git commit -q -m "Mars data: MEDA $c processed" || echo "Nothing new for $c"
            for attempt in 1 2 3 4 5; do
              git pull -q --rebase origin mars-probe && git push -q origin HEAD:mars-probe && break
              sleep $((attempt * 10))
            done
          done

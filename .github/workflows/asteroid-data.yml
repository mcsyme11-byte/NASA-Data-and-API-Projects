# NASA Data Projects · Asteroid Tracker daily data · © 2026 Malcolm Syme · mcsyme11@gmail.com
#
# Once a day, refreshes the Asteroid Tracker's close-approach files from the NASA/JPL close-approach API
# (asteroid-tracker/fetch_close_approaches.py): this year, next year, and any missing year since 2000, plus the
# index data/years.json. Commits the files when they have changed; GitHub Pages then republishes the site.
# The JPL API blocks direct calls from web pages (no CORS), which is why the data is fetched here.
# Run by hand: Actions › Asteroid data › Run workflow ("all" refreshes every year).

name: Asteroid data

on:
  schedule:
    - cron: '17 6 * * *'   # 06:17 UTC daily
  workflow_dispatch:
    inputs:
      all:
        description: 'Refresh every year, not only this year, next year and missing years'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: asteroid-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch close approaches
        run: python3 asteroid-tracker/fetch_close_approaches.py ${{ inputs.all && '--all' || '' }}
      - name: Commit if changed
        run: |
          git add -A asteroid-tracker/data/
          if git diff --cached --quiet; then
            echo "No change in the data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Asteroid data: daily close-approach update"
          git push

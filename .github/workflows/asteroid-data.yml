# NASA and ESA Data Projects · Asteroid Tracker daily data · © 2026 Malcolm Syme · mcsyme11@gmail.com
#
# Once a day, refreshes the Asteroid Tracker's data files and commits them when they have changed; GitHub Pages then
# republishes the site:
#   fetch_close_approaches.py  close approaches (NASA/JPL CAD API): this year, next year, any missing year since 2000
#   fetch_map_data.py          every near-Earth asteroid's orbit (NASA/JPL SBDB) and spacecraft positions (Horizons)
#   fetch_risk.py              impact-risk lists (ESA NEOCC and NASA/JPL Sentry) and ESA's close approaches
#   fetch_neows.py             a copy of NASA's NeoWs weeks and asteroid pages, so visitors need no key; it uses the
#                              developer's key from the repository secret NASA_API_KEY (never in a file)
# The JPL APIs block direct calls from web pages (no CORS), which is why the data is fetched here.
# Run by hand: Actions › Asteroid data › Run workflow ("all" refreshes every year).
# Two daily times: GitHub sometimes delays or skips a scheduled run when busy (Nov 9, 2026: the 06:17 run never
# started), so a second run later in the day catches up. When the first run has already done the work, the second
# finds no change and commits nothing.

name: Asteroid data

on:
  schedule:
    - cron: '17 6 * * *'    # 06:17 UTC daily
    - cron: '47 14 * * *'   # 14:47 UTC daily, the backup
  # also whenever a data script or this workflow changes on main, so new data appears with the code that uses it
  push:
    branches: [main]
    paths:
      - 'asteroid-tracker/fetch_*.py'
      - '.github/workflows/asteroid-data.yml'
  workflow_dispatch:
    inputs:
      all:
        description: 'Refresh every year, not only this year, next year and missing years'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: asteroid-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Fetch close approaches
        run: python3 asteroid-tracker/fetch_close_approaches.py ${{ inputs.all && '--all' || '' }}
      - name: Fetch asteroid orbits and spacecraft positions
        run: python3 asteroid-tracker/fetch_map_data.py
      # ESA NEOCC and NASA/JPL Sentry. If one of them cannot be read, the run is marked with a warning but the other
      # data is still saved (the script keeps that source's previous figures).
      - name: Fetch impact-risk lists and ESA close approaches
        continue-on-error: true
        run: python3 asteroid-tracker/fetch_risk.py
      # NeoWs weeks around today and their asteroids' pages (api.nasa.gov needs a key: the secret NASA_API_KEY, which
      # GitHub hides in the log). If it fails, the previous copy is kept and the pages ask NASA directly instead.
      - name: Copy NASA NeoWs weeks and asteroid pages
        continue-on-error: true
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: python3 asteroid-tracker/fetch_neows.py
      - name: Commit if changed
        run: |
          git add -A asteroid-tracker/data/
          if git diff --cached --quiet; then
            echo "No change in the data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Asteroid data: daily close-approach, impact-risk and NeoWs update"
          # Other work may have been pushed while the data was fetched: put this commit on top of it and retry.
          for attempt in 1 2 3 4 5; do
            git pull --rebase --quiet && git push && exit 0
            echo "Push attempt $attempt did not succeed; retrying."
            sleep $((attempt * 10))
          done
          exit 1

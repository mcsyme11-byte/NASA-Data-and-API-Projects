# One-off check of data sources (run by hand; removed after use).
name: Source check (one-off)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Astronaut photos without a key
        run: |
          A="Mozilla/5.0 (compatible; data-check)"; B=https://eol.jsc.nasa.gov/SearchPhotos
          curl -sSL -A "$A" -c j.txt -b j.txt "$B/PhotoIdSets/PhotoIdSets.pl?set=Latest_ISS_Imagery&view=1" -o /dev/null
          curl -sSL -A "$A" -b j.txt "$B/GetTSVFromQueryResults.pl?results=Latest_ISS_Imagery" -o p.tsv -w "tsv %{http_code} %{size_download} %{content_type}\n"
          head -c 1500 p.tsv; echo; echo "lines: $(wc -l < p.tsv)"
          python3 - <<'PY'
          import csv
          rows=list(csv.reader(open('p.tsv',encoding='utf-8',errors='replace'),delimiter='\t'))
          print('header:', rows[0]); print('row1:', rows[1]); print('row2:', rows[2])
          h=rows[0]
          for k in h:
              if any(w in k.lower() for w in ('lat','lon','date','feat','cloud','file','direct')): print(k, '->', [r[h.index(k)] for r in rows[1:4] if len(r)>h.index(k)])
          PY
          curl -sSL -A "$A" "https://eol.jsc.nasa.gov/temp/Latest_ISS_Imagery.json" -o l.json -w "json %{http_code} %{size_download}\n"; head -c 1200 l.json; echo
      - name: Other sources (CORS headers)
        run: |
          for u in "https://api.wheretheiss.at/v1/satellites/25544" "http://api.open-notify.org/iss-now.json"; do
            echo "=== $u"; curl -sS -o /dev/null -D - -H "Origin: https://example.org" "$u" | grep -iE "^HTTP|access-control-allow-origin|content-type|content-length"; done
          curl -sS https://api.wheretheiss.at/v1/satellites/25544 | head -c 600; echo

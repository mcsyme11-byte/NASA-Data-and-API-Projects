# NASA Data Projects · checks · © 2026 Malcolm Syme · mcsyme11@gmail.com
#
# After every push to main (and on pull requests), checks the repository against CLAUDE.md's rules with
# dev/check_wording.py: neutral wording, no personal paths or user names, and no NASA API key (the repository is
# public). If it finds anything, the check fails and GitHub emails the developer. It never changes anything itself.

name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Wording, personal details and keys
        run: python3 dev/check_wording.py

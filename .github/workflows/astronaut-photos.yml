# NASA and ESA Data Projects · Image Explorer astronaut photos · © 2026 Malcolm Syme · mcsyme11@gmail.com
#
# Once a day, fetches the newest cataloged astronaut photos of Earth (with their positions) from the Gateway to
# Astronaut Photography of Earth (eol.jsc.nasa.gov) and commits image-explorer/data/astronaut.json when it has changed;
# GitHub Pages then republishes the site. The API needs a free key, kept as the repository secret EOL_API_KEY
# (Settings › Secrets and variables › Actions); without it the job ends without changing anything.
# Web pages cannot call this API (no CORS headers), which is why the data is fetched here.
# Run by hand: Actions › Astronaut photos › Run workflow.

name: Astronaut photos

on:
  schedule:
    - cron: '41 7 * * *'   # 07:41 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: astronaut-photos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch astronaut photos
        env:
          EOL_API_KEY: ${{ secrets.EOL_API_KEY }}
        run: python3 image-explorer/fetch_astronaut_photos.py
      - name: Commit if changed
        run: |
          git add image-explorer/data/astronaut.json
          if git diff --cached --quiet; then
            echo "No change in the photos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Astronaut photos: daily update"
          git pull --rebase
          git push

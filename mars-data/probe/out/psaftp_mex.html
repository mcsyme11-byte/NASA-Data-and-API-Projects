    <div id="dragTopInfo-notification" class="is-hidden bg-primaryMain is-absolute py-2 px-4 gap-3">

          To download, hold down CTRL/CMD(Mac) key and drag to your desktop.
        </p>

          Press Esc to cancel
        </p>

                    <i class="icon-reorder text-primaryMain"></i>
                  </button>
                </div>

                <div class="logo-section-wrapper">
                  <div class="is-flex is-align-items-center is-justify-content-flex-start logo-section">
                    <a id="left-logo" class="is-flex" href="#/">
                      <div id="logo-container" class="logo">
                        <w-image theme-specific="true" alt="crush-logo" class="logo is-hidden" src="WebInterface/images/logo.png">
                        <div class="skeleton skeleton-rect" data-rect-h="100%" data-c-w="100%" data-c-p="0%" data-lines="0" data-bg="var(--bg-skeleton)"></div>
                      </div>
                    </a>
                    <w-theme tabindex="0"></w-theme>
                    <p id="header-text-section2" class="text-primaryMain text-xs is-hidden"></p>
                  </div>
                </div>
              </div>

                  <div class="hamburger-menu-btn" aria-label="basket-icon-btn" tabindex="-1">
                    <i class="icon-shopping-cart text-primaryMain"></i>
                  </div>
                </div>

                <!-- Dropdown for activities -->
                <div tabindex="0" id="activity-dropdown" class="dropdown" data-close-on-click-inside="false">
                  <button type="button" id="operations-badge-button" class="hamburger-menu-btn dropdown-trigger" aria-label="activity-count-btn" tabindex="-1">
                    <span id="activity-count" class="operations-badge is-hidden">
                      0
                    </span>
                    <i class="icon-bell text-primaryMain"></i>
                  </button>
                  <div id="activityDropdownMenu" class="dropdown-menu">
                    <div id="activitiesContent" class="dropdown-content"></div>
                  </div>
                </div>

                <nav class="is-flex is-align-items-center navbar-container">
                  <w-language id="localization-languages" class="is-hidden" tabindex="0"></w-language>

                <option value="500">500</option>
                <option value="1000">1000</option>
                <option value="2000">2000</option>
                <option value="-1">All</option>
